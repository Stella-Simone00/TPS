<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagrafica 1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .gabbia {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        input {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px 16px;
            color: #f0f6fc;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #58a6ff;
            background: #282e36;
        }

        input::placeholder {
            color: #8b949e;
        }

        button {
            background: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        button:hover {
            background: #2ea043;
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 0.9rem;
            border-bottom: 1px solid #30363d;
        }

        th {
            background: #161b22;
            color: #8b949e;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td {
            color: #f0f6fc;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Anagrafica 1.0</h1>

        <div class="gabbia">
            <input type="text" id="nome" placeholder="Nome">
            <input type="text" id="cognome" placeholder="Cognome">
            <input type="text" id="indirizzo" placeholder="Indirizzo">
            <input type="text" id="citta" placeholder="Città">
            <input type="number" id="eta" placeholder="Età">
            
            <button onclick="aggiungiDati()">Aggiungi alla Tabella</button>
        </div>

        <table id="tabellaAnagrafica">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Indirizzo</th>
                    <th>Città</th>
                    <th>Età</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        function aggiungiDati() {
            let valNome = document.getElementById("nome").value;
            let valCognome = document.getElementById("cognome").value;
            let valIndirizzo = document.getElementById("indirizzo").value;
            let valCitta = document.getElementById("citta").value;
            let valEta = document.getElementById("eta").value;

            if(valNome === "" || valCognome === "") {
                alert("Inserisci almeno Nome e Cognome!");
                return;
            }

            let tbody = document.getElementById("tabellaAnagrafica").getElementsByTagName('tbody')[0];
            let nuovaRiga = tbody.insertRow();

            nuovaRiga.insertCell(0).innerText = valNome;
            nuovaRiga.insertCell(1).innerText = valCognome;
            nuovaRiga.insertCell(2).innerText = valIndirizzo;
            nuovaRiga.insertCell(3).innerText = valCitta;
            nuovaRiga.insertCell(4).innerText = valEta;

            document.getElementById("nome").value = "";
            document.getElementById("cognome").value = "";
            document.getElementById("indirizzo").value = "";
            document.getElementById("citta").value = "";
            document.getElementById("eta").value = "";
            
            document.getElementById("nome").focus();
        }
    </script>

</body>
</html>
