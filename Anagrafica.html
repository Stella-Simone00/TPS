<!DOCTYPE html>
<html>
<head>
    <title>Anagrafica 1.0</title>
</head>
<body>

    <h2>Anagrafica 1.0</h2>

    <div style="border: 1px solid black; padding: 10px; width: 250px;">
        Nome: <br>
        <input type="text" id="nome"><br><br>
        
        Cognome: <br>
        <input type="text" id="cognome"><br><br>
        
        Indirizzo: <br>
        <input type="text" id="indirizzo"><br><br>
        
        Città: <br>
        <input type="text" id="citta"><br><br>
        
        Età: <br>
        <input type="number" id="eta"><br><br>
        
        <button onclick="aggiungi()">Aggiungi</button>
    </div>

    <br><br>

    <table border="1" id="miaTabella">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Indirizzo</th>
                <th>Città</th>
                <th>Età</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        function aggiungi() {
            var n = document.getElementById("nome").value;
            var c = document.getElementById("cognome").value;
            var i = document.getElementById("indirizzo").value;
            var ci = document.getElementById("citta").value;
            var e = document.getElementById("eta").value;

            var tabella = document.getElementById("miaTabella");

            var riga = tabella.insertRow(-1);

            var c1 = riga.insertCell(0);
            var c2 = riga.insertCell(1);
            var c3 = riga.insertCell(2);
            var c4 = riga.insertCell(3);
            var c5 = riga.insertCell(4);

            c1.innerHTML = n;
            c2.innerHTML = c;
            c3.innerHTML = i;
            c4.innerHTML = ci;
            c5.innerHTML = e;

            document.getElementById("nome").value = "";
            document.getElementById("cognome").value = "";
            document.getElementById("indirizzo").value = "";
            document.getElementById("citta").value = "";
            document.getElementById("eta").value = "";
        }
    </script>

</body>
</html>
