<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica 1.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        .sottotitolo {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #8b949e;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .gabbia {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .gabbia input {
            width: 100%;
            padding: 14px 16px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .gabbia input:focus {
            border-color: #58a6ff;
        }

        .gabbia input::placeholder {
            color: #6e7681;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .tabella-wrapper {
            margin-top: 30px;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            background-color: #21262d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #30363d;
        }

        th {
            background-color: #161b22;
            color: #8b949e;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td {
            color: #e6edf3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Anagrafica 1.0</h2>

        <div class="sottotitolo">Lavori di TPS</div>

        <div class="gabbia">
            <input type="text" id="nome" placeholder="Nome">
            <input type="text" id="cognome" placeholder="Cognome">
            <input type="text" id="indirizzo" placeholder="Indirizzo">
            <input type="text" id="citta" placeholder="Città">
            <input type="number" id="eta" placeholder="Età">
            
            <button onclick="aggiungi()">Aggiungi alla tabella →</button>
        </div>

        <div class="tabella-wrapper">
            <table id="miaTabella">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cognome</th>
                        <th>Indirizzo</th>
                        <th>Città</th>
                        <th>Età</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function aggiungi() {
            const n = document.getElementById("nome").value;
            const c = document.getElementById("cognome").value;
            const i = document.getElementById("indirizzo").value;
            const ci = document.getElementById("citta").value;
            const e = document.getElementById("eta").value;

            const tabella = document.getElementById("miaTabella");
            const riga = tabella.insertRow(-1);

            const c1 = riga.insertCell(0);
            const c2 = riga.insertCell(1);
            const c3 = riga.insertCell(2);
            const c4 = riga.insertCell(3);
            const c5 = riga.insertCell(4);

            c1.innerHTML = n;
            c2.innerHTML = c;
            c3.innerHTML = i;
            c4.innerHTML = ci;
            c5.innerHTML = e;

            document.getElementById("nome").value = "";
            document.getElementById("cognome").value = "";
            document.getElementById("indirizzo").value = "";
            document.getElementById("citta").value = "";
            document.getElementById("eta").value = "";
        }
    </script>

</body>
</html>
