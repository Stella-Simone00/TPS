<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica 1.0</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .sottotitolo {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .gabbia input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .gabbia input:focus {
            border-color: #58a6ff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background-color: #30363d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background-color: #21262d;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #30363d;
        }

        th {
            background-color: #161b22;
            color: #8b949e;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Anagrafica 1.0</h2>

        <div class="sottotitolo">Inserimento Dati</div>

        <div class="gabbia">
            <input type="text" id="nome" placeholder="Nome">
            <input type="text" id="cognome" placeholder="Cognome">
            <input type="text" id="indirizzo" placeholder="Indirizzo">
            <input type="text" id="citta" placeholder="Città">
            <input type="number" id="eta" placeholder="Età">
            
            <button onclick="aggiungi()">Aggiungi alla tabella →</button>
        </div>

        <table id="miaTabella">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Indirizzo</th>
                    <th>Città</th>
                    <th>Età</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        function aggiungi() {
            const n = document.getElementById("nome").value;
            const c = document.getElementById("cognome").value;
            const i = document.getElementById("indirizzo").value;
            const ci = document.getElementById("citta").value;
            const e = document.getElementById("eta").value;

            const tabella = document.getElementById("miaTabella");
            const riga = tabella.insertRow(-1);

            const c1 = riga.insertCell(0);
            const c2 = riga.insertCell(1);
            const c3 = riga.insertCell(2);
            const c4 = riga.insertCell(3);
            const c5 = riga.insertCell(4);

            c1.innerHTML = n;
            c2.innerHTML = c;
            c3.innerHTML = i;
            c4.innerHTML = ci;
            c5.innerHTML = e;

            document.getElementById("nome").value = "";
            document.getElementById("cognome").value = "";
            document.getElementById("indirizzo").value = "";
            document.getElementById("citta").value = "";
            document.getElementById("eta").value = "";
        }
    </script>

</body>
</html>
