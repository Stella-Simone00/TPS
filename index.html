<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPS | Progetti</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        h2 {
            color: #8b949e;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .lavori-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lavoro-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #21262d;
            border: 1px solid #30363d;
            padding: 16px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: #f0f6fc;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .lavoro-item:hover {
            border-color: #58a6ff;
            background: #282e36;
            transform: translateY(-2px);
        }

        .lavoro-item span {
            color: #8b949e;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Progetto TPS</h1>

        <h2>Lavori</h2>

        <div class="lavori-list">
            <a href="#" class="lavoro-item">
                Lavoro 1
                <span>→</span>
            </a>
            <a href="#" class="lavoro-item">
                Lavoro 2
                <span>→</span>
            </a>
            <a href="#" class="lavoro-item">
                Lavoro 3
                <span>→</span>
            </a>
        </div>
    </div>

</body>
</html>
